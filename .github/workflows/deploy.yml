name: Deploy dist to SiteGround (laveranda.kvtechub.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-laveranda-kvtechub
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

  DEPLOY_HOST: "gnldm1021.siteground.biz"
  DEPLOY_PORT: "18765"
  DEPLOY_USER: "u2886-xxymc8nixnud"
  DEPLOY_ROOT: "/home/u2886-xxymc8nixnud/www/laveranda.kvtechub.com"

  KEEP_RELEASES: "5"
  SPA_FALLBACK: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      artifact_tgz: ${{ steps.meta.outputs.artifact_tgz }}
      artifact_sha: ${{ steps.meta.outputs.artifact_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Verify dist
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html || true
          ls -lah dist | head -n 80

      - name: Pack dist tarball + sha
        id: meta
        shell: bash
        env:
          GZIP: -n
        run: |
          set -euo pipefail

          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}"
          TGZ="dist-${RELEASE_ID}.tar.gz"
          SHA="dist-${RELEASE_ID}.tar.gz.sha256"

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_tgz=${TGZ}" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=${SHA}" >> "$GITHUB_OUTPUT"

          tar -C dist --owner=0 --group=0 --mtime='UTC 1970-01-01' -czf "$TGZ" .
          sha256sum "$TGZ" > "$SHA"
          ls -lah "$TGZ" "$SHA"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: |
            ${{ steps.meta.outputs.artifact_tgz }}
            ${{ steps.meta.outputs.artifact_sha }}
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-release

      - name: Prepare remote folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          script: |
            set -e
            mkdir -p "${{ env.DEPLOY_ROOT }}/incoming"
            mkdir -p "${{ env.DEPLOY_ROOT }}/releases"

      - name: Upload tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          source: ${{ needs.build.outputs.artifact_tgz }}
          target: ${{ env.DEPLOY_ROOT }}/incoming
          overwrite: true

      - name: Upload sha256
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          source: ${{ needs.build.outputs.artifact_sha }}
          target: ${{ env.DEPLOY_ROOT }}/incoming
          overwrite: true

      - name: Atomic extract + switch current
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          script: |
            set -euo pipefail

            ROOT="${{ env.DEPLOY_ROOT }}"
            RELEASE_ID="${{ needs.build.outputs.release_id }}"
            TGZ="${ROOT}/incoming/${{ needs.build.outputs.artifact_tgz }}"
            SHA="${ROOT}/incoming/${{ needs.build.outputs.artifact_sha }}"

            test -f "$TGZ"
            test -f "$SHA"

            (cd "${ROOT}/incoming" && sha256sum -c "$(basename "$SHA")")

            FINAL_DIR="${ROOT}/releases/${RELEASE_ID}"
            TMP_DIR="${ROOT}/releases/.tmp-${RELEASE_ID}"

            rm -rf "$TMP_DIR" || true
            mkdir -p "$TMP_DIR"
            tar -xzf "$TGZ" -C "$TMP_DIR"

            # sanity check: must contain at least one file
            test -n "$(ls -A "$TMP_DIR")"

            # optional SPA routing
            if [ "${{ env.SPA_FALLBACK }}" = "true" ]; then
              HTACCESS="${TMP_DIR}/.htaccess"
              : > "$HTACCESS"
              printf '%s\n' 'RewriteEngine On' >> "$HTACCESS"
              printf '%s\n' 'RewriteBase /' >> "$HTACCESS"
              printf '%s\n' 'RewriteCond %{REQUEST_FILENAME} -f [OR]' >> "$HTACCESS"
              printf '%s\n' 'RewriteCond %{REQUEST_FILENAME} -d' >> "$HTACCESS"
              printf '%s\n' 'RewriteRule ^ - [L]' >> "$HTACCESS"
              printf '%s\n' 'RewriteRule ^assets/ - [L]' >> "$HTACCESS"
              printf '%s\n' 'RewriteRule . /index.html [L]' >> "$HTACCESS"
            fi

            # promote tmp -> final atomically
            rm -rf "$FINAL_DIR" || true
            mv "$TMP_DIR" "$FINAL_DIR"

            # update previous/current safely
            if [ -L "${ROOT}/current" ]; then
              ln -sfnT "$(readlink "${ROOT}/current")" "${ROOT}/previous" || true
            fi
            ln -sfnT "$FINAL_DIR" "${ROOT}/current"

            # cleanup incoming artifacts
            rm -f "$TGZ" "$SHA" || true

            # prune old releases (keep last N)
            KEEP="${{ env.KEEP_RELEASES }}"
            cd "${ROOT}/releases"
            ls -1t | grep -v '^\.' | tail -n +"$((KEEP+1))" | xargs -r rm -rf

            echo "Deployed: ${RELEASE_ID}"
