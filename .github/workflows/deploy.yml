name: Deploy Static Site (dist) to SiteGround Subdomain

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-laveranda-kvtechub
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

  DEPLOY_HOST: "gnldm1021.siteground.biz"
  DEPLOY_PORT: "18765"
  DEPLOY_USER: "u2886-xxymc8nixnud"
  DEPLOY_ROOT: "/home/u2886-xxymc8nixnud/www/laveranda.kvtechub.com"

  KEEP_RELEASES: "5"
  SPA_FALLBACK: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      artifact_tgz: ${{ steps.meta.outputs.artifact_tgz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build (dist)
        run: npm run build

      - name: Verify dist exists
        run: |
          test -d dist
          test -f dist/index.html || echo "dist/index.html not found (ok if not SPA)" >&2
          ls -lah dist | head -n 80

      - name: Create release artifact
        id: meta
        env:
          GZIP: -n
        run: |
          RELEASE_ID="$_
