name: Deploy dist to SiteGround (laveranda.kvtechub.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-laveranda-kvtechub
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

  DEPLOY_HOST: "gnldm1021.siteground.biz"
  DEPLOY_PORT: "18765"
  DEPLOY_USER: "u2886-xxymc8nixnud"
  DEPLOY_ROOT: "/home/u2886-xxymc8nixnud/www/laveranda.kvtechub.com"

  KEEP_RELEASES: "5"
  SPA_FALLBACK: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Verify dist
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          ls -lah dist | head -n 80

      - name: Create release id
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Pack dist + sha (normalized names)
        shell: bash
        env:
          GZIP: -n
        run: |
          set -euo pipefail
          tar -C dist --owner=0 --group=0 --mtime='UTC 1970-01-01' -czf dist.tar.gz .
          sha256sum dist.tar.gz > dist.tar.gz.sha256
          ls -lah dist.tar.gz dist.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: |
            dist.tar.gz
            dist.tar.gz.sha256
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-release

      - name: Prepare remote folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          script: |
            set -e
            mkdir -p "${{ env.DEPLOY_ROOT }}/incoming" "${{ env.DEPLOY_ROOT }}/releases"
            rm -f "${{ env.DEPLOY_ROOT }}/incoming/dist.tar.gz" "${{ env.DEPLOY_ROOT }}/incoming/dist.tar.gz.sha256" || true

      - name: Upload tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          source: dist.tar.gz
          target: ${{ env.DEPLOY_ROOT }}/incoming
          overwrite: true

      - name: Upload sha256
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          source: dist.tar.gz.sha256
          target: ${{ env.DEPLOY_ROOT }}/incoming
          overwrite: true

      - name: Atomic extract + switch current
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          script: |
            set -euo pipefail

            ROOT="${{ env.DEPLOY_ROOT }}"
            RELEASE_ID="${{ needs.build.outputs.release_id }}"

            TGZ="${ROOT}/incoming/dist.tar.gz"
            SHA="${ROOT}/incoming/dist.tar.gz.sha256"

            test -f "$TGZ"
            test -f "$SHA"

            (cd "${ROOT}/incoming" && sha256sum -c "dist.tar.gz.sha256")

            FINAL_DIR="${ROOT}/releases/${RELEASE_ID}"
            TMP_DIR="${ROOT}/releases/.tmp-${RELEASE_ID}"

            rm -rf "$TMP_DIR" "$FINAL_DIR" || true
            mkdir -p "$TMP_DIR"
            tar -xzf "$TGZ" -C "$TMP_DIR"

            # Strong sanity check for Vite dist
            test -f "$TMP_DIR/index.html"
            test -n "$(ls -A "$TMP_DIR")"

            # Optional SPA routing
            if [ "${{ env.SPA_FALLBACK }}" = "true" ]; then
              HTACCESS="${TMP_DIR}/.htaccess"
              : > "$HTACCESS"
              printf '%s\n' 'RewriteEngine On' >> "$HTACCESS"
              printf '%s\n' 'RewriteBase /' >> "$HTACCESS"
              printf '%s\n' 'RewriteCond %{REQUEST_FILENAME} -f [OR]' >> "$HTACCESS"
              printf '%s\n' 'RewriteCond %{REQUEST_FILENAME} -d' >> "$HTACCESS"
              printf '%s\n' 'RewriteRule ^ - [L]' >> "$HTACCESS"
              printf '%s\n' 'RewriteRule ^assets/ - [L]' >> "$HTACCESS"
              printf '%s\n' 'RewriteRule . /index.html [L]' >> "$HTACCESS"
            fi

            # Promote tmp -> final atomically
            mv "$TMP_DIR" "$FINAL_DIR"

            # Marker file to verify live release
            echo "$RELEASE_ID" > "$FINAL_DIR/__release.txt"

            # Update previous/current with ABSOLUTE targets
            if [ -L "${ROOT}/current" ]; then
              CUR_ABS="$(readlink -f "${ROOT}/current" || true)"
              if [ -n "$CUR_ABS" ] && [ -d "$CUR_ABS" ]; then
                ln -sfn "$CUR_ABS" "${ROOT}/previous"
              fi
            fi

            ln -sfn "$FINAL_DIR" "${ROOT}/current"

            # Cleanup incoming artifacts (normalized names)
            rm -f "$TGZ" "$SHA" || true

            # Prune old releases deterministically (by name)
            KEEP="${{ env.KEEP_RELEASES }}"
            cd "${ROOT}/releases"
            RELEASES="$(ls -1 | grep -E '^[0-9]{14}-[0-9]+$' | sort -r)"
            echo "$RELEASES" | tail -n +"$((KEEP+1))" | xargs -r rm -rf

            echo "Deployed: ${RELEASE_ID}"
            echo "Current -> $(readlink -f "${ROOT}/current" || true)"
