name: Deploy Static Site (dist) to SiteGround Subdomain

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-laveranda-kvtechub
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

  DEPLOY_HOST: "gnldm1021.siteground.biz"
  DEPLOY_PORT: "18765"
  DEPLOY_USER: "u2886-xxymc8nixnud"
  DEPLOY_ROOT: "/home/u2886-xxymc8nixnud/www/laveranda.kvtechub.com"

  KEEP_RELEASES: "5"
  SPA_FALLBACK: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      artifact_tgz: ${{ steps.meta.outputs.artifact_tgz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build (dist)
        run: npm run build

      - name: Verify dist exists
        run: |
          test -d dist
          test -f dist/index.html || echo "dist/index.html not found (ok if not SPA)" >&2
          ls -lah dist | head -n 80

      - name: Create release artifact
        id: meta
        env:
          GZIP: -n
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}"
          ARTIFACT_TGZ="dist-${RELEASE_ID}.tar.gz"
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "artifact_tgz=${ARTIFACT_TGZ}" >> $GITHUB_OUTPUT

          tar -C dist --owner=0 --group=0 --mtime='UTC 1970-01-01' -czf "${ARTIFACT_TGZ}" .
          sha256sum "${ARTIFACT_TGZ}" > "${ARTIFACT_TGZ}.sha256"

          ls -lah "${ARTIFACT_TGZ}" "${ARTIFACT_TGZ}.sha256"

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: |
            ${{ steps.meta.outputs.artifact_tgz }}
            ${{ steps.meta.outputs.artifact_tgz }}.sha256
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-release

      - name: Ensure remote folders exist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          script: |
            set -e
            mkdir -p "${{ env.DEPLOY_ROOT }}"/{incoming,releases}
            mkdir -p "${{ env.DEPLOY_ROOT }}/public_html"

      - name: Upload artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          source: "${{ needs.build.outputs.artifact_tgz }},${{ needs.build.outputs.artifact_tgz }}.sha256"
          target: "${{ env.DEPLOY_ROOT }}/incoming"
          overwrite: true

      - name: Deploy atomically (extract + symlinks)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_RSA_PRIVATE }}
          passphrase: ${{ secrets.DEPLOY_RSA_PASSWORD }}
          script: |
            set -euo pipefail

            ROOT="${{ env.DEPLOY_ROOT }}"
            RELEASE_ID="${{ needs.build.outputs.release_id }}"
            TGZ="${ROOT}/incoming/${{ needs.build.outputs.artifact_tgz }}"
            SHA="${TGZ}.sha256"

            test -f "$TGZ"
            test -f "$SHA"

            # Verify checksum
            (cd "${ROOT}/incoming" && sha256sum -c "$(basename "$SHA")")

            # Extract to a new release folder
            RELEASE_DIR="${ROOT}/releases/${RELEASE_ID}"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$TGZ" -C "$RELEASE_DIR"

            # Optional SPA routing (.htaccess)
            if [ "${{ env.SPA_FALLBACK }}" = "true" ]; then
              cat > "${RELEASE_DIR}/.htaccess" <<'HT'
              RewriteEngine On
              RewriteBase /
              RewriteRule ^index\.html$ - [L]
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
              HT
            fi

            # Flip symlinks: previous -> current, current -> new release
            if [ -L "${ROOT}/current" ]; then
              ln -sfnT "$(readlink "${ROOT}/current")" "${ROOT}/previous" || true
            fi
            ln -sfnT "$RELEASE_DIR" "${ROOT}/current"

            # Ensure docroot points to current
            ln -sfnT "${ROOT}/current" "${ROOT}/public_html"

            # Cleanup incoming
            rm -f "$TGZ" "$SHA" || true

            # Prune old releases (keep last N by mtime)
            KEEP="${{ env.KEEP_RELEASES }}"
            if [ -n "$KEEP" ]; then
              cd "${ROOT}/releases"
              ls -1t | tail -n +"$((KEEP+1))" | xargs -r rm -rf
            fi

            echo "Deployed release: ${RELEASE_ID}"
